name: Documentation Site

# Builds the standalone generator and the site from doc-site/. A pull request that only
# touches the Java library does not run this: the paths filter keeps it on doc-site/**.
on:
  push:
    branches:
    - develop
    - main
    paths:
    - doc-site/**
    - .github/workflows/doc-site.yaml
  pull_request:
    branches:
    - develop
    - main
    paths:
    - doc-site/**
    - .github/workflows/doc-site.yaml
  workflow_dispatch:

# develop and main both publish the same site. Serialize them instead of cancelling a
# deploy that is already in progress.
concurrency:
  group: doc-site-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'liberica'
        cache: maven
    # The runnable cells execute Java in a Web Image (doc-site/runtime). Building it needs
    # Oracle GraalVM 25.5 (javac and Espresso on the WebAssembly backend) and Binaryen.
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        # A 25.5 release: the Web Image backend and Espresso on it need 25.5 (25.0.x
        # cannot compile Truffle for WebAssembly).
        version: '25.5'
        distribution: 'graalvm'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cache: maven
    - name: Set up Binaryen
      run: |
        set -euo pipefail
        curl -sSL -o binaryen.tar.gz \
          https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz
        tar xzf binaryen.tar.gz
        echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
        # LD_LIBRARY_PATH is unset on a fresh runner; `${VAR:-}` keeps `set -u` happy.
        echo "LD_LIBRARY_PATH=$PWD/binaryen-version_130/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
    # The documentation-to-YAVI mapping lives in versions.yaml only. Derive one line per
    # version for the runtime build and the generated-site check below.
    - name: Read the version mapping
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import sys
        import yaml
        with open("doc-site/content/versions.yaml", encoding="utf-8") as f:
            data = yaml.safe_load(f)
        lines = []
        for entry in data.get("versions") or []:
            version = str(entry.get("version") or "").strip()
            release = str(entry.get("yavi_release") or "").strip()
            if not version or not release:
                sys.exit(f"versions.yaml: entry {entry!r} needs both version and yavi_release")
            lines.append(f"{version} {release}")
        if not lines:
            sys.exit("versions.yaml lists no versions")
        with open("runtime-versions.txt", "w", encoding="utf-8") as out:
            out.write("\n".join(lines) + "\n")
        PY
        cat runtime-versions.txt
    # One Web Image per documented version: the YAVI classes are baked into the image, so
    # a shared image cannot serve two releases. Adding a version to versions.yaml without
    # a reachable release fails here (and in the generator's versions.yaml validation).
    - name: Build the browser runtimes
      run: |
        set -euo pipefail
        # The Espresso/Truffle artifacts must match the installed GraalVM exactly; take
        # the version from the release string instead of duplicating it here.
        GRAALVM_MVN_VERSION=$(native-image --version | sed -nE 's/.*Oracle GraalVM ([0-9.]+)\+.*/\1/p' | head -1)
        while read -r version release; do
          echo "::group::Runtime for documentation $version (YAVI $release)"
          echo "Building the runtime for GraalVM $GRAALVM_MVN_VERSION"
          ./mvnw -V --no-transfer-progress -f doc-site/runtime/pom.xml -Pweb package -DskipTests \
            -Dgraalvm.version="$GRAALVM_MVN_VERSION" \
            -Ddocs.version="$version" \
            -Dyavi.version="$release"
          test -f "doc-site/runtime/target/web/$version/yavi-runtime-wasm.js.wasm" \
            || { echo "missing runtime for documentation version $version"; exit 1; }
          echo "::endgroup::"
        done < runtime-versions.txt
    # Compiles and runs every ```java runnable block of both language trees and asserts
    # the hidden expected output; a broken or drifted example fails the build here.
    - name: Test the documented examples in the browser runtime
      run: node --experimental-wasm-exnref doc-site/runtime/test/run.js
    - name: Set up JDK 21 for the generator
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'liberica'
        cache: maven
    - name: Unit Tests
      run: ./mvnw -V --no-transfer-progress -f doc-site/pom.xml test
    - name: Build the generator
      run: ./mvnw -V --no-transfer-progress -f doc-site/pom.xml package -DskipTests
    - name: Generate the site
      run: java -jar doc-site/target/yavi-docgen.jar --source doc-site/content --out _site --runtime doc-site/runtime/target/web
    - name: Check the generated site
      run: |
        set -euo pipefail
        for path in \
            index.html \
            versions.json \
            0.17/en/index.html \
            0.17/en/getting-started.html \
            0.17/ja/index.html \
            0.17/en/search-index.json \
            getting-started.html \
            built-in-constraints.html; do
          test -f "_site/${path}" || { echo "missing _site/${path}"; exit 1; }
        done
        # Every documented version must publish a full runtime, never the stub: the three
        # files are what the page loads, and their absence would silently disable Run.
        while read -r version release; do
          test -f "_site/${version}/en/index.html" \
            || { echo "missing page tree for documentation version $version"; exit 1; }
          for file in yavi-runtime.js yavi-runtime-wasm.js yavi-runtime-wasm.js.wasm; do
            test -f "_site/assets/runtime/${version}/${file}" \
              || { echo "missing runtime file for documentation version $version: ${file} (YAVI $release)"; exit 1; }
          done
        done < runtime-versions.txt
        grep -q 'url=0.17/en/index.html' _site/index.html
        grep -q 'url=0.17/en/getting-started.html' _site/getting-started.html
        grep -q 'url=0.17/en/built-in-constraints.html' _site/built-in-constraints.html
    # The Web Image is hundreds of MB (it compresses to well under the 100 MB git blob
    # limit). Publishing the site as a Pages artifact keeps it out of git history; a
    # gh-pages push would be rejected for the uncompressed wasm alone.
    - name: Add the custom domain
      run: |
        cp doc-site/CNAME _site/CNAME
        touch _site/.nojekyll
    - name: Configure Pages
      if: github.event_name != 'pull_request'
      uses: actions/configure-pages@v5
    - name: Upload the Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v4
      with:
        path: _site

  # Publishes the artifact to GitHub Pages. The repository's Pages source must be
  # "GitHub Actions"; the custom domain stays configured in the repository settings.
  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
