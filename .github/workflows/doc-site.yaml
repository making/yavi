name: Documentation Site

# Builds the standalone generator and the site from doc-site/. A pull request that only
# touches the Java library does not run this: the paths filter keeps it on doc-site/**.
on:
  push:
    branches:
    - develop
    - main
    paths:
    - doc-site/**
    - .github/workflows/doc-site.yaml
  pull_request:
    branches:
    - develop
    - main
    paths:
    - doc-site/**
    - .github/workflows/doc-site.yaml
  workflow_dispatch:

# develop and main both publish the same site. Serialize them instead of cancelling a
# deploy that is already in progress.
concurrency:
  group: doc-site-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# The Web Image is derived from the GraalVM release and Binaryen (it assembles the wasm),
# so both are part of the runtime cache key. They are declared only here so the toolchain
# setup and the key cannot drift apart.
env:
  GRAALVM_VERSION: '25.5'
  BINARYEN_VERSION: '130'

jobs:
  # The documented versions are the matrix for the runtime build. Parsing here means a
  # version added to versions.yaml is built (and required by the generated-site check)
  # without touching this workflow.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
    - uses: actions/checkout@v7
    - name: Read the version mapping
      id: read
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import sys
        import yaml
        with open("doc-site/content/versions.yaml", encoding="utf-8") as f:
            data = yaml.safe_load(f)
        include = []
        for entry in data.get("versions") or []:
            version = str(entry.get("version") or "").strip()
            release = str(entry.get("yavi_release") or "").strip()
            if not version or not release:
                sys.exit(f"versions.yaml: entry {entry!r} needs both version and yavi_release")
            include.append({"version": version, "yavi_release": release})
        if not include:
            sys.exit("versions.yaml lists no versions")
        with open("runtime-versions.txt", "w", encoding="utf-8") as out:
            out.write("".join(f"{e['version']} {e['yavi_release']}\n" for e in include))
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write("matrix=" + json.dumps({"include": include}) + "\n")
        PY
        cat runtime-versions.txt
    - name: Upload the version mapping
      uses: actions/upload-artifact@v4
      with:
        name: version-mapping
        path: runtime-versions.txt

  # One Web Image per documented version: the YAVI classes are baked into the image, so
  # a shared image cannot serve two releases. Building a version without a reachable
  # release fails here (and in the generator's versions.yaml validation).
  runtime:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v7
    # A cache hit skips the toolchain setup and native-image. The key covers everything
    # the image is derived from: the runtime sources and build config, the GraalVM
    # release, Binaryen, and the documentation version with its YAVI release. Repository
    # caches are size-limited and can be evicted at any time, so a miss only makes the
    # run slower: the image is rebuilt and checked below before it is uploaded. A
    # restored entry is checked as well, so a partial one can never reach the site job.
    - name: Restore the browser runtime
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: doc-site/runtime/target/web/${{ matrix.version }}
        key: docs-runtime-${{ matrix.version }}-yavi-${{ matrix.yavi_release }}-graalvm-${{ env.GRAALVM_VERSION }}-binaryen-${{ env.BINARYEN_VERSION }}-${{ hashFiles('doc-site/runtime/**') }}
    # The runnable cells execute Java in a Web Image (doc-site/runtime). Building it needs
    # Oracle GraalVM 25.5 (javac and Espresso on the WebAssembly backend) and Binaryen.
    - name: Set up GraalVM
      if: steps.cache.outputs.cache-hit != 'true'
      uses: graalvm/setup-graalvm@v1
      with:
        # A 25.5 release: the Web Image backend and Espresso on it need 25.5 (25.0.x
        # cannot compile Truffle for WebAssembly).
        version: ${{ env.GRAALVM_VERSION }}
        distribution: 'graalvm'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cache: maven
    - name: Set up Binaryen
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        curl -sSL -o binaryen.tar.gz \
          "https://github.com/WebAssembly/binaryen/releases/download/version_${{ env.BINARYEN_VERSION }}/binaryen-version_${{ env.BINARYEN_VERSION }}-x86_64-linux.tar.gz"
        tar xzf binaryen.tar.gz
        echo "$PWD/binaryen-version_${{ env.BINARYEN_VERSION }}/bin" >> "$GITHUB_PATH"
        # LD_LIBRARY_PATH is unset on a fresh runner; `${VAR:-}` keeps `set -u` happy.
        echo "LD_LIBRARY_PATH=$PWD/binaryen-version_${{ env.BINARYEN_VERSION }}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
    - name: Build the browser runtime
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        # The Espresso/Truffle artifacts must match the installed GraalVM exactly; take
        # the version from the release string instead of duplicating it here.
        GRAALVM_MVN_VERSION=$(native-image --version | sed -nE 's/.*Oracle GraalVM ([0-9.]+)\+.*/\1/p' | head -1)
        echo "Building the runtime for documentation ${{ matrix.version }} (YAVI ${{ matrix.yavi_release }}) with GraalVM $GRAALVM_MVN_VERSION"
        ./mvnw -V --no-transfer-progress -f doc-site/runtime/pom.xml -Pweb package -DskipTests \
          -Dgraalvm.version="$GRAALVM_MVN_VERSION" \
          -Ddocs.version="${{ matrix.version }}" \
          -Dyavi.version="${{ matrix.yavi_release }}"
    # Checked on a hit as well: the site job must never receive a stub or a partial entry.
    - name: Check the browser runtime
      run: |
        set -euo pipefail
        dir="doc-site/runtime/target/web/${{ matrix.version }}"
        for file in yavi-runtime.js yavi-runtime-wasm.js yavi-runtime-wasm.js.wasm; do
          test -s "$dir/$file" || { echo "missing runtime file $dir/$file"; exit 1; }
        done
    - name: Save the browser runtime
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: doc-site/runtime/target/web/${{ matrix.version }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Upload the browser runtime
      uses: actions/upload-artifact@v4
      with:
        name: runtime-${{ matrix.version }}
        path: doc-site/runtime/target/web/${{ matrix.version }}
        # The artifact is consumed by the site job of this run only.
        retention-days: 1
        if-no-files-found: error

  site:
    needs: [versions, runtime]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # The agent skill version counts the commits that can change it, so the
        # history has to be here.
        fetch-depth: 0
    - name: Download the version mapping
      uses: actions/download-artifact@v4
      with:
        name: version-mapping
    # Each matrix job uploads one version's runtime. The unmerged download keeps the
    # artifact names apart; lay them out under the directory the harness and the
    # generator read, in the same shape a local multi-version build produces.
    - name: Download the browser runtimes
      uses: actions/download-artifact@v4
      with:
        pattern: runtime-*
        path: runtime-artifacts
    - name: Lay out the browser runtimes
      run: |
        set -euo pipefail
        mkdir -p doc-site/runtime/target/web
        for dir in runtime-artifacts/runtime-*; do
          test -d "$dir" || { echo "no runtime artifacts downloaded"; exit 1; }
          version=${dir#runtime-artifacts/runtime-}
          mkdir -p "doc-site/runtime/target/web/$version"
          cp -a "$dir"/. "doc-site/runtime/target/web/$version/"
        done
        ls -l doc-site/runtime/target/web
    # Compiles and runs every ```java runnable block of both language trees and asserts
    # the hidden expected output; a broken or drifted example fails the build here.
    - name: Test the documented examples in the browser runtime
      run: |
        set -euo pipefail
        for version in $(cut -d' ' -f1 runtime-versions.txt); do
          DOCS_VERSION="$version" node --experimental-wasm-exnref doc-site/runtime/test/run.js
        done
    - name: Set up JDK 21 for the generator
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'liberica'
        cache: maven
    - name: Unit Tests
      run: ./mvnw -V --no-transfer-progress -f doc-site/pom.xml test
    - name: Build the generator
      run: ./mvnw -V --no-transfer-progress -f doc-site/pom.xml package -DskipTests
    - name: Generate the site
      run: java -jar doc-site/target/yavi-docgen.jar --source doc-site/content --out _site --runtime doc-site/runtime/target/web
    # The skill's version is <documented version>.<commits that can change it>, but only
    # if the bundle's CONTENT actually moved: the generator compares its digest against
    # the published one and keeps the old version when they match, so a rebuilt site does
    # not tell every installed copy to re-download itself. Pull requests compute the same
    # version; only a push publishes it.
    - name: Compute the agent skill version
      id: skill
      run: |
        set -euo pipefail
        BASE=$(python3 - <<'PY'
        import yaml
        with open("doc-site/content/versions.yaml", encoding="utf-8") as f:
            versions = [str(v.get("version")) for v in yaml.safe_load(f).get("versions") or []]
        print(max(versions, key=lambda v: [int(p) if p.isdigit() else 0 for p in v.split(".")]))
        PY
        )
        COMMITS=$(git rev-list --count HEAD -- doc-site/content \
          doc-site/src/main/java/am/ik/yavi/docgen/SkillGen.java doc-site/src/main/resources/skill)
        echo "version=${BASE}.${COMMITS}" >> "$GITHUB_OUTPUT"
        PUBLISHED=$(curl -sSL --fail https://yavi.ik.am/skill/version.json || echo '{}')
        echo "previous-version=$(echo "$PUBLISHED" | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p')" >> "$GITHUB_OUTPUT"
        echo "previous-hash=$(echo "$PUBLISHED" | sed -n 's/.*"contentHash": *"\([^"]*\)".*/\1/p')" >> "$GITHUB_OUTPUT"
        echo "candidate ${BASE}.${COMMITS}; published $PUBLISHED"
    # Generated from the same Markdown as the site, so the skill cannot drift from it.
    - name: Generate the agent skill
      run: |
        java -jar doc-site/target/yavi-docgen.jar skill \
          --source doc-site/content --out _site/skill \
          --version '${{ steps.skill.outputs.version }}' \
          --previous-version '${{ steps.skill.outputs.previous-version }}' \
          --previous-hash '${{ steps.skill.outputs.previous-hash }}' \
          --commit '${{ github.sha }}' \
          --site-base https://yavi.ik.am
    - name: Check the generated site
      run: |
        set -euo pipefail
        for path in \
            index.html \
            versions.json \
            0.17/en/index.html \
            0.17/en/getting-started.html \
            0.17/ja/index.html \
            0.17/en/search-index.json \
            0.18/en/agent-skill.html \
            skill/index.html \
            skill/marketplace.json \
            skill/yavi/SKILL.md \
            skill/yavi/references/contents.md \
            skill/yavi-plugin.zip \
            skill/yavi-skill.tar.gz \
            getting-started.html \
            built-in-constraints.html; do
          test -f "_site/${path}" || { echo "missing _site/${path}"; exit 1; }
        done
        # Every documented version must publish a full runtime, never the stub: the three
        # files are what the page loads, and their absence would silently disable Run.
        while read -r version release; do
          test -f "_site/${version}/en/index.html" \
            || { echo "missing page tree for documentation version $version"; exit 1; }
          for file in yavi-runtime.js yavi-runtime-wasm.js yavi-runtime-wasm.js.wasm; do
            test -f "_site/assets/runtime/${version}/${file}" \
              || { echo "missing runtime file for documentation version $version: ${file} (YAVI $release)"; exit 1; }
          done
        done < runtime-versions.txt
        # The root and the unversioned stubs follow the default of versions.yaml, so
        # releasing a version does not need a change here.
        DEFAULT=$(python3 -c 'import yaml; d = yaml.safe_load(open("doc-site/content/versions.yaml")); print(d["default_version"] + "/" + d["default_language"])')
        grep -q "url=${DEFAULT}/index.html" _site/index.html
        grep -q "url=${DEFAULT}/getting-started.html" _site/getting-started.html
        grep -q "url=${DEFAULT}/built-in-constraints.html" _site/built-in-constraints.html
    # The Web Image is hundreds of MB (it compresses to well under the 100 MB git blob
    # limit). Publishing the site as a Pages artifact keeps it out of git history; a
    # gh-pages push would be rejected for the uncompressed wasm alone.
    - name: Add the custom domain
      run: |
        cp doc-site/CNAME _site/CNAME
        touch _site/.nojekyll
    - name: Configure Pages
      if: github.event_name != 'pull_request'
      uses: actions/configure-pages@v5
    - name: Upload the Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v4
      with:
        path: _site

  # Publishes the artifact to GitHub Pages. The repository's Pages source must be
  # "GitHub Actions"; the custom domain stays configured in the repository settings.
  deploy:
    needs: site
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
