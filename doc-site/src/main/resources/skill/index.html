<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAVI agent skill</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0 auto; padding: 2rem 1.25rem 4rem; max-width: 44rem; background: #ffffff; color: #1f2328;
       font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
h1 { font-size: 1.75rem; margin-bottom: .25rem; }
h2 { font-size: 1.15rem; margin-top: 2.25rem; }
p, li, td { color: #3d444d; }
a { color: #0969da; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
pre { background: #f6f8fa; border: 1px solid #d1d9e0; border-radius: 6px; padding: .85rem 1rem;
      overflow-x: auto; }
pre code { color: #1f2328; }
.version { display: inline-block; padding: .1rem .5rem; border: 1px solid #d1d9e0; border-radius: 999px;
           font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; color: #59636e; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #d1d9e0; vertical-align: top; }
footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #d1d9e0; font-size: .9rem; }
@media (prefers-color-scheme: dark) {
  body { background: #12151b; color: #d7dce5; }
  p, li, td { color: #b7bfcc; }
  a { color: #8ab4f8; }
  pre { background: #0c0e13; border-color: #232833; }
  pre code { color: #e6ebf3; }
  .version { border-color: #2c3342; color: #9aa4b5; }
  th, td, footer { border-color: #232833; }
}
</style>
</head>
<body>
<p><span class="version">{{version}}</span></p>
{{body}}
<footer>
Part of the <a href="{{site-base}}/{{docs-version}}/{{lang}}/">YAVI documentation</a> -- this
page is its <a href="{{site-base}}/{{docs-version}}/{{lang}}/agent-skill.html">Agent Skill</a>
guide, so the instructions here and there cannot disagree.
</footer>
</body>
</html>
