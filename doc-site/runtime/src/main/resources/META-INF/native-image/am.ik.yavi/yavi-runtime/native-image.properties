# javac: the compiler reads java.base from the image heap, so its classes, resource
# bundles and lint state are initialized while the image is built.
Args = --initialize-at-build-time=am.ik.yavi.runtime.preload,am.ik.yavi.runtime.BuildInfo,com.sun.tools.javac.code.Lint,com.sun.tools.javac.code.Lint$LintCategory,com.sun.tools.javac.api.JavacTool,com.sun.tools.javac.resources,com.sun.tools.javac.util \
       -H:+UnlockExperimentalVMOptions \
       -H:IncludeResources=yavi-classes/.*\.class|yavi-classes\.index|yavi-version\.properties|am/ik/yavi/runtime/guest/.*\.class \
       -H:IncludeResourceBundles=com.sun.tools.javac.resources.compiler,com.sun.tools.javac.resources.javac,com.sun.tools.javac.resources.version \
       -H:-UnlockExperimentalVMOptions
